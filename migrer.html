<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Migration</title>
<style>body{font-family:sans-serif;padding:14px}button{display:block;width:100%;padding:14px;margin:8px 0;font-size:16px}pre{white-space:pre-wrap;font-size:12px;background:#111;color:#0f0;padding:8px;min-height:200px}</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<script src="firebase-init.js"></script>
</head><body><h3>Migration des champs sensibles</h3><div id="st">Connexion...</div>
<button id="b1">1. Sauvegarde (telecharger)</button><button id="b2">2. Simulation</button><button id="b3">3. Migrer (copie, sans suppression)</button><button id="b4">4. Complements (simulation)</button><button id="b5">5. Complements (copie)</button><button id="b6">6. Suppression racine (simulation)</button><button id="b7">7. SUPPRIMER de la racine</button><pre id="log"></pre>
<script>
const L=m=>{document.getElementById('log').textContent+=m+'\n'};
const C=['email','telephone','whatsapp'],S=['dateNaissance','handicapCategorie','handicapPrecision','carteInvalidite','besoinGuide','nomGuide','licenceFegoph'];
const has=v=>v!==undefined&&v!==null&&v!=='';
const R=async f=>{for(let i=0;;i++){try{return await f()}catch(e){if(e.code!=='unavailable'||i>=4)throw e;await new Promise(r=>setTimeout(r,1500*(i+1)))}}};
let user=null;const db=()=>window.db||firebase.firestore();
firebase.auth().onAuthStateChanged(u=>{user=u;document.getElementById('st').textContent=u?('Connecte : '+(u.email||u.uid)):'Non connecte : connectez-vous sur admin.html puis revenez ici.'});
async function backup(){const s=await R(()=>db().collection('users').get());const out={};
for(const d of s.docs){const o={root:d.data()};for(const n of ['contact','sensible']){const x=await R(()=>d.ref.collection('private').doc(n).get());if(x.exists)o[n]=x.data()}out[d.id]=o}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='sauvegarde_users_'+Date.now()+'.json';document.body.appendChild(a);a.click();L('Sauvegarde : '+s.docs.length+' comptes')}
async function migrate(dry){const s=await R(()=>db().collection('users').get());let ok=0,ko=0,rien=0;const TS=firebase.firestore.FieldValue.serverTimestamp();
for(const d of s.docs){const r=d.data(),ref=d.ref.collection('private');
try{const c=await R(()=>ref.doc('contact').get()),z=await R(()=>ref.doc('sensible').get());const cd=c.exists?c.data():{},sd=z.exists?z.data():{};const pc={},ps={},root={};
C.forEach(k=>{if(has(r[k])&&!has(cd[k]))pc[k]=r[k]});S.forEach(k=>{if(has(r[k])&&!has(sd[k]))ps[k]=r[k]});
const dn=r.dateNaissance||sd.dateNaissance;if(has(dn)&&!has(r.anneeNaissance)){const y=new Date(dn.toDate?dn.toDate():dn).getFullYear();if(y>1900&&y<2100)root.anneeNaissance=y}
const n=Object.keys(pc).length+Object.keys(ps).length+Object.keys(root).length;if(!n){rien++;continue}
L(d.id.slice(0,6)+' contact:'+Object.keys(pc).length+' sensible:'+Object.keys(ps).length+(root.anneeNaissance?' annee':''));
if(!dry){if(Object.keys(pc).length)await ref.doc('contact').set({...pc,updatedAt:TS},{merge:true});if(Object.keys(ps).length)await ref.doc('sensible').set({...ps,updatedAt:TS},{merge:true});if(Object.keys(root).length)await d.ref.update(root)}
ok++}catch(e){ko++;L('ERREUR '+d.id.slice(0,6)+' '+(e.code||e.message))}}
L((dry?'SIMULATION ':'FAIT ')+'- a traiter:'+ok+' deja ok:'+rien+' erreurs:'+ko)}
const go=f=>async()=>{if(!user){L('Non connecte');return}try{await f()}catch(e){L('ERREUR '+(e.code||e.message))}};
const same=(a,b)=>{const n=v=>v&&v.toDate?v.toDate().toISOString():v;return JSON.stringify(n(a))===JSON.stringify(n(b))};
const sha=async t=>{const n=String(t||'').replace(/[^\d+]/g,'');if(!n)return '';const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')};
async function extra(dry){
const s=await R(()=>db().collection('users').get());let ok=0,rien=0,ko=0;const TS=firebase.firestore.FieldValue.serverTimestamp();
for(const d of s.docs){try{
const r=d.data(),ref=d.ref.collection('private');
const c=await R(()=>ref.doc('contact').get()),cd=c.exists?c.data():{};
const pc={},root={},pt=r.gouvernance&&r.gouvernance.presidentTelephone,tel=has(cd.telephone)?cd.telephone:r.telephone;
if(has(pt)&&!has(cd.presidentTelephone))pc.presidentTelephone=pt;
if(has(tel)&&!has(r.telephoneHash)){const h=await sha(tel);if(h)root.telephoneHash=h}
if(r.whatsappPublic===true&&!has(r.whatsappPublicNumero)&&has(tel))root.whatsappPublicNumero=tel;
const np=Object.keys(pc).length,nr=Object.keys(root).length;if(!np&&!nr){rien++;continue}
L(d.id.slice(0,6)+' contact:'+Object.keys(pc).join(',')+' racine:'+Object.keys(root).join(','));
if(!dry){if(np)await ref.doc('contact').set({...pc,updatedAt:TS},{merge:true});if(nr)await d.ref.update(root)}
ok++}catch(e){ko++;L('ERREUR '+d.id.slice(0,6)+' '+(e.code||e.message))}}
L((dry?'SIMULATION ':'FAIT ')+'- a traiter:'+ok+' deja ok:'+rien+' erreurs:'+ko)}
async function purge(dry){
if(!dry&&!window.__bk){L('Faites d abord la sauvegarde (bouton 1)');return}
const s=await R(()=>db().collection('users').get());let ok=0,bloque=0,rien=0,ko=0;const DEL=firebase.firestore.FieldValue.delete();
for(const d of s.docs){try{
const r=d.data(),ref=d.ref.collection('private');
const c=await R(()=>ref.doc('contact').get()),z=await R(()=>ref.doc('sensible').get());
const cd=c.exists?c.data():{},sd=z.exists?z.data():{};
const del={},bad=[];
const chk=(k,p)=>{if(!has(r[k]))return;if(same(r[k],p[k]))del[k]=DEL;else bad.push(k)};
C.forEach(k=>chk(k,cd));S.forEach(k=>chk(k,sd));
const pt=r.gouvernance&&r.gouvernance.presidentTelephone;
if(has(pt)){if(same(pt,cd.presidentTelephone))del['gouvernance.presidentTelephone']=DEL;else bad.push('presidentTelephone')}
if(del.telephone&&(!has(r.telephoneHash)||(r.whatsappPublic===true&&!has(r.whatsappPublicNumero)))){delete del.telephone;bad.push('telephone(etape 5 requise)')}
if(del.dateNaissance&&!has(r.anneeNaissance)){delete del.dateNaissance;bad.push('dateNaissance(annee manquante)')}
const n=Object.keys(del).length;
if(bad.length)L(d.id.slice(0,6)+' BLOQUE: '+bad.join(','));
if(!n){if(bad.length)bloque++;else rien++;continue}
if(!dry)await d.ref.update(del);
ok++;if(bad.length)bloque++}catch(e){ko++;L('ERREUR '+d.id.slice(0,6)+' '+(e.code||e.message))}}
L((dry?'SIMULATION ':'FAIT ')+'- comptes nettoyes:'+ok+' avec champs bloques:'+bloque+' deja propres:'+rien+' erreurs:'+ko)}
const __g=i=>document.getElementById(i);
b1.onclick=go(async()=>{await backup();window.__bk=1});
__g('b4').onclick=go(()=>extra(true));
__g('b5').onclick=go(()=>confirm('Copier les complements ?')?extra(false):0);
__g('b6').onclick=go(()=>purge(true));
__g('b7').onclick=go(()=>confirm('SUPPRIMER de la racine les champs verifies ? Irreversible hors sauvegarde.')?purge(false):0);
b2.onclick=go(()=>migrate(true));b3.onclick=go(()=>confirm('Lancer la migration (copie uniquement) ?')?migrate(false):0);
</script></body></html>
